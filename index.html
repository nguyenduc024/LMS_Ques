<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống học tập trực tuyến</title>
  <link rel="icon" type="image/jpeg" href="mewvicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <img class="logo" src="mewvicon.jpg" alt="Logo">
      <span class="brand">HỆ THỐNG HỌC TẬP TRỰC TUYẾN</span>
    </div>
  </header>

  <main class="wrap">
    <!-- Trang chủ -->
    <section id="screen-home" class="screen">
      <div id="home-box" class="box home">
        <label for="name">Họ và tên</label>
        <input id="name" type="text" maxlength="100" autocomplete="name">

        <label for="time">Thời gian làm đề 40 câu</label>
        <select id="time">
          <option value="30">30 phút</option>
          <option value="45">45 phút</option>
          <option value="60" selected>60 phút</option>
          <option value="90">90 phút</option>
          <option value="0">Không giới hạn</option>
        </select>

        <div class="music-ask">
          <span>Phát nhạc khi làm bài?</span>
          <label><input type="radio" name="music" value="1"> Có</label>
          <label><input type="radio" name="music" value="0" checked> Không</label>
        </div>

        <div id="music-panel" class="music-panel" hidden>
          <div id="wheel-home"></div>
          <div class="music-side">
            <div id="covers" class="covers"></div>
            <p class="now"><b id="now-title"></b> <span id="now-artist"></span></p>
            <div class="progress">
              <span id="t-cur">0:00</span>
              <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Tua bài hát">
              <span id="t-dur">0:00</span>
            </div>
            <p id="music-note" class="status"></p>
          </div>
        </div>

        <div class="home-actions">
          <button id="btn-practice" class="btn" type="button">Luyện tập từng câu</button>
          <button id="btn-exam" class="btn" type="button">Làm đề 40 câu</button>
        </div>
        <p id="home-status" class="status"></p>
      </div>
    </section>

    <!-- Luyện tập từng câu -->
    <section id="screen-practice" class="screen" hidden>
      <div class="box">
        <div id="p-question"></div>
        <div class="nav-buttons">
          <button id="p-finish" class="btn" type="button">Hoàn tất bài kiểm tra</button>
          <button id="p-next" class="btn" type="button">Câu tiếp</button>
        </div>
      </div>
    </section>

    <!-- Làm đề 40 câu -->
    <section id="screen-exam" class="screen" hidden>
      <div class="layout">
        <div class="box main">
          <div id="e-question"></div>
          <div class="nav-buttons">
            <button id="e-prev" class="btn" type="button">Previous page</button>
            <button id="e-next" class="btn" type="button">Next page</button>
          </div>
        </div>
        <aside class="box sidebar">
          <h2>Quiz navigation</h2>
          <div id="e-grid" class="grid"></div>
          <button id="e-finish" class="link" type="button">Finish attempt ...</button>
          <p class="timer"><span id="e-timer-label">Thời gian còn lại</span> <b id="e-timer"></b></p>
          <p id="e-status" class="status"></p>
        </aside>
      </div>
    </section>

    <!-- Kết quả -->
    <section id="screen-result" class="screen" hidden>
      <div class="box">
        <h2 class="result-title" id="r-title"></h2>
        <table class="summary" id="r-summary"></table>
        <p id="r-status" class="status"></p>
        <div class="nav-buttons left">
          <button id="btn-home" class="btn" type="button">Về trang chủ</button>
        </div>
      </div>
      <div id="r-review"></div>
    </section>
  </main>

  <!-- Trình phát YouTube ẩn (chỉ lấy tiếng) -->
  <div class="yt-hidden" aria-hidden="true"><div id="yt-player"></div></div>

  <!-- Máy nghe nhạc thu nhỏ khi đang làm bài -->
  <div id="mini-player" class="mini-player" hidden>
    <!-- Cột bìa album, hiện khi di chuột vào đĩa -->
    <div id="mini-covers" class="mini-covers"></div>
    <div id="wheel-mini"></div>
    <div class="mini-info">
      <b id="mini-title"></b>
      <span id="mini-artist"></span>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="music/playlist.js"></script>
  <script src="js/common.js"></script>
  <script src="js/music.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/exam.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
